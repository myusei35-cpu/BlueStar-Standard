<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブランド顔帳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#0f0f0f;color:#f0f0f0;min-height:100vh;padding:12px}
.topbar{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.search{display:flex;align-items:center;gap:6px;flex:1;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:10px;padding:9px 12px}
.search input{border:none;background:transparent;font-size:15px;color:#f0f0f0;outline:none;flex:1;font-family:inherit}
.search input::placeholder{color:#555}
.btn{font-size:13px;padding:9px 13px;border-radius:10px;border:1px solid #2a2a2a;background:#1c1c1c;color:#f0f0f0;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit}
.btn:active{opacity:0.7}
.btn.add{background:#5046e5;border-color:#5046e5;color:#fff}
.count{font-size:12px;color:#555;margin-bottom:8px;padding-left:2px}
.card{background:#1a1a1a;border:1px solid #252525;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.brand{font-size:15px;font-weight:600;color:#f0f0f0}
.actions{display:flex;gap:6px}
.iBtn{background:none;border:none;cursor:pointer;color:#555;padding:3px;line-height:0;border-radius:6px}
.iBtn.edit:hover{color:#5046e5}
.iBtn.del:hover{color:#e55}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:12px;padding:3px 9px;border-radius:20px;background:#252525;color:#ccc;border:1px solid #333}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:99;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:#1a1a1a;border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:500px;border-top:1px solid #2a2a2a}
.sheet h3{font-size:16px;font-weight:600;margin-bottom:16px}
.sheet label{font-size:12px;color:#888;display:block;margin-bottom:5px}
.sheet input,.sheet textarea{width:100%;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#f0f0f0;font-family:inherit;outline:none;margin-bottom:14px}
.sheet textarea{min-height:72px;resize:vertical}
.sheet-btns{display:flex;gap:8px;justify-content:flex-end}
.empty{text-align:center;padding:40px 0;color:#444;font-size:14px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#5046e5;color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;z-index:200}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="q" placeholder="ブランド・キーワードで検索" oninput="render()">
  </div>
  <button class="btn add" onclick="openAdd()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    追加
  </button>
</div>

<div class="count" id="count"></div>
<div id="list"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="overlay" onclick="bgClose(event)">
  <div class="sheet">
    <h3 id="sheet-title">ブランドを追加</h3>
    <label>ブランド名</label>
    <input type="text" id="f-name" placeholder="例: sacai">
    <label>アイコン（カンマ区切り）</label>
    <textarea id="f-icons" placeholder="例: ドッキング, プリーツ, ニット切替"></textarea>
    <div class="sheet-btns">
      <button class="btn" onclick="closeSheet()">キャンセル</button>
      <button class="btn add" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<script>
const DB_NAME="brandcheat";
const STORE="brands";
const DEFAULT=[
  {name:"Vivienne Westwood",icons:["オーブ","ラブジャケット","土星ロゴ"]},
  {name:"Maison Margiela",icons:["足袋ブーツ","4ステッチ","白タグ番号"]},
  {name:"Jean Paul Gaultier",icons:["パワーネット","総柄","コルセット風"]},
  {name:"Ann Demeulemeester",icons:["モノトーンレイヤード","細紐","デコンスト"]},
  {name:"MARNI",icons:["カラーブロック","モヘヤ","構築的デザイン"]},
  {name:"GANNI",icons:["フラワープリント","ポップカラー","ギャザー"]},
  {name:"sacai",icons:["ドッキング（異素材）","プリーツ","ニット切替"]},
  {name:"TOGA",icons:["ドッキング","メタル装飾","変形シルエット"]},
  {name:"PLEATS PLEASE",icons:["転写プリント","プリーツ","イッセイ系"]},
  {name:"Hysteric Glamour",icons:["ヒスガール","スタッズ","ロックプリント"]},
  {name:"Mame Kurogouchi",icons:["繊細レース","刺繍","透け素材"]},
  {name:"kolor",icons:["異素材切り替え","レイヤード","実験的裁断"]},
  {name:"ENFOLD",icons:["変形デザイン","鮮やかな色","ミニマル構築"]},
  {name:"Maison Special",icons:["シャギー","マルチカラー","配色ニット"]},
  {name:"LEINWANDE",icons:["ハンドクラフトニット","フリンジ","手編み風"]},
  {name:"CFCL",icons:["ウェーブ","立体フレア","3Dニット"]},
  {name:"IRENE",icons:["変形","レース","大胆カッティング"]},
  {name:"FUMIE≠TANAKA",icons:["シアー","レイヤード","フリンジ"]},
  {name:"UN3D.",icons:["配色","アシメトリー","カラーブロック"]},
  {name:"Diagram",icons:["刺繍","レース","ビジュー装飾"]},
  {name:"UNITED TOKYO",icons:["配色","アシメトリー","モード系"]},
  {name:"Ameri VINTAGE",icons:["アートプリント","マーブル柄","シアー"]},
  {name:"FETICO",icons:["ブラジャンプスーツ","シアー","前衛シルエット"]},
];

let db;
let editId=null;

function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});
      }
    };
    req.onsuccess=e=>{res(e.target.result)};
    req.onerror=e=>{rej(e)};
  });
}

function getAll(){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).getAll();
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  });
}

function putItem(item){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    const req=tx.objectStore(STORE).put(item);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=rej;
  });
}

function delItem(id){
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,"readwrite");
    const req=tx.objectStore(STORE).delete(id);
    req.onsuccess=res;
    req.onerror=rej;
  });
}

async function seedIfEmpty(){
  const all=await getAll();
  if(all.length===0){
    for(const d of DEFAULT) await putItem(d);
  }
}

async function render(){
  const q=document.getElementById("q").value.toLowerCase();
  const all=await getAll();
  const filtered=all.filter(d=>
    !q||d.name.toLowerCase().includes(q)||d.icons.some(ic=>ic.toLowerCase().includes(q))
  );
  document.getElementById("count").textContent=filtered.length+"件";
  const list=document.getElementById("list");
  if(!filtered.length){
    list.innerHTML='<div class="empty">該当なし</div>';
    return;
  }
  list.innerHTML=filtered.map(d=>`
    <div class="card">
      <div class="card-header">
        <div class="brand">${d.name}</div>
        <div class="actions">
          <button class="iBtn edit" onclick="openEdit(${d.id})" aria-label="編集">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="iBtn del" onclick="del(${d.id})" aria-label="削除">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
      <div class="pills">${d.icons.map(ic=>`<span class="pill">${ic}</span>`).join("")}</div>
    </div>
  `).join("");
}

function openAdd(){
  editId=null;
  document.getElementById("sheet-title").textContent="ブランドを追加";
  document.getElementById("f-name").value="";
  document.getElementById("f-icons").value="";
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("f-name").focus(),100);
}

async function openEdit(id){
  const all=await getAll();
  const item=all.find(d=>d.id===id);
  if(!item)return;
  editId=id;
  document.getElementById("sheet-title").textContent="編集";
  document.getElementById("f-name").value=item.name;
  document.getElementById("f-icons").value=item.icons.join(", ");
  document.getElementById("overlay").classList.add("open");
  setTimeout(()=>document.getElementById("f-name").focus(),100);
}

function closeSheet(){document.getElementById("overlay").classList.remove("open")}
function bgClose(e){if(e.target===document.getElementById("overlay"))closeSheet()}

async function saveEntry(){
  const name=document.getElementById("f-name").value.trim();
  if(!name)return;
  const icons=document.getElementById("f-icons").value
    .split(/[,、\n]/).map(s=>s.trim()).filter(Boolean);
  const item=editId?{id:editId,name,icons}:{name,icons};
  await putItem(item);
  closeSheet();
  render();
  toast(editId?"更新しました":"追加しました");
}

async function del(id){
  if(!confirm("削除しますか？"))return;
  await delItem(id);
  render();
  toast("削除しました");
}

function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2000);
}

(async()=>{
  db=await openDB();
  await seedIfEmpty();
  render();
})();
</script>
</body>
</html>
